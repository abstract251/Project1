<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>与顾言的聊天 · 缘遇 YUANYU</title>
  <meta name="description" content="让沟通自然、流畅、有温度。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/chat.css" />
</head>

<body class="chat-page">

  <!-- ======================= 顶部导航 ======================= -->
  <header class="topbar chat-top">
    <a class="icon-btn" href="../index.html" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
    </a>

    <div class="chat-partner">
      <span class="partner-avatar grad-3">顾</span>
      <div class="partner-info">
        <p class="partner-name">顾言</p>
        <p class="partner-status" id="statusText"><i></i>在线</p>
      </div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="menuBtn" aria-label="更多" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" /></svg>
      </button>
      <div class="chat-menu" id="chatMenu" hidden>
        <a href="profile.html">查看资料</a>
        <button type="button" id="clearChat">清空聊天记录</button>
        <button type="button" id="reportBtn">举报</button>
      </div>
    </div>
  </header>

  <!-- ======================= 消息区 ======================= -->
  <main class="chat-body thin-scroll" id="chatBody" aria-live="polite"></main>

  <!-- ======================= 底部输入区 ======================= -->
  <footer class="chat-input">
    <button class="icon-btn" id="emojiBtn" aria-label="表情">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6" /><path d="M8.6 14.2c.9 1.1 2 1.7 3.4 1.7s2.5-.6 3.4-1.7" /><path d="M9.2 9.6h.01M14.8 9.6h.01" stroke-width="2.4" /></svg>
    </button>
    <button class="icon-btn" id="imgBtn" aria-label="发送图片">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3" /><circle cx="9" cy="10" r="1.7" /><path d="M4.5 17l4.6-4.6 3.2 3.2 2.6-2.6 4.6 4.4" /></svg>
    </button>

    <div class="chat-field">
      <input id="msgInput" type="text" maxlength="500" placeholder="说点什么…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" type="button" disabled aria-label="发送">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </button>
    </div>
  </footer>

  <script src="../js/chat.js"></script>
</body>
</html>
