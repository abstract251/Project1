<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>综合心理测评</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/records.css">
  <!-- 登录检测：未登录直接跳转登录页 -->
  <script src="../js/auth.js"></script>
</head>
<body>
  <div class="page-shell">
    <div class="page-inner side-layout">
      <!-- 桌面端左侧固定导航栏（js/sidebar.js 渲染，手机端不显示） -->
      <aside class="side-nav" id="sidebar"></aside>
      <div class="side-main">
      <!-- 对应小程序 pages/assessment-records/index -->
      <div class="records-page">
        <div class="nav-header">
          <button class="nav-back" id="navBack">‹ 返回</button>
          <div class="nav-title">测评记录</div>
          <div class="nav-right"></div>
        </div>

        <div class="search-bar">
          <input class="search-input" id="keyword" placeholder="搜索用户姓名" autocomplete="off">
          <button class="search-action" id="searchBtn">搜索</button>
        </div>

        <div class="page-content">
          <div class="list-header">
            <span class="list-title" id="listTitle">共 0 条记录</span>
          </div>

          <div class="record-list" id="recordList"></div>

          <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📋</div>
            <div class="empty-text">暂无测评记录</div>
          </div>

          <div class="loading-more" id="loadingMore" style="display:none;">
            <span class="loading-text">加载中...</span>
          </div>

          <div class="load-more-tip" id="loadMoreTip" style="display:none;">
            <span class="tip-text">- 已加载全部记录 -</span>
          </div>

          <!-- 桌面端"加载更多"按钮（records.js 动态控制显隐） -->
          <div class="load-more-btn-wrap" id="loadMoreBtnWrap" style="display:none;">
            <button class="load-more-btn" id="loadMoreBtn">加载更多</button>
          </div>
        </div>

        <!-- ===== 网站备案与联系信息（ICP备案号需链接工信部） ===== -->
        <div class="site-footer">
          <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">鄂ICP备2026035916号</a>
          <span class="site-footer-sep">|</span>
          <span>运营主体：唐帅</span>
          <span class="site-footer-sep">|</span>
          <span>联系电话：19807189010</span>
          <span class="site-footer-sep">|</span>
          <a href="mailto:2966255045@qq.com">2966255045@qq.com</a>
          <span class="site-footer-sep">|</span>
          <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42282602000160" target="_blank" rel="noopener noreferrer">鄂公网安备42282602000160号</a>
        </div>
      </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/pages/records.js"></script>
</body>
</html>
