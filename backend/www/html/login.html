<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理员登录</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="page-shell">
    <div class="page-inner">
      <!-- 对应小程序 pages/login/index -->
      <div class="login-page">
        <div class="login-header">
          <div class="login-icon">🔐</div>
          <span class="login-title">管理员登录</span>
          <span class="login-subtitle">请输入管理员账号密码</span>
        </div>

        <div class="login-form">
          <div class="form-item">
            <label class="form-label">账号</label>
            <input class="form-input" id="username" placeholder="请输入账号" autocomplete="off">
          </div>

          <div class="form-item">
            <label class="form-label">密码</label>
            <input class="form-input" id="password" type="password" placeholder="请输入密码" autocomplete="off">
          </div>

          <button class="login-btn" id="loginBtn">登 录</button>

          <button class="back-btn" id="backBtn">返回首页</button>
        </div>
      </div>

      <!-- ===== 网站备案与联系信息（ICP备案号需链接工信部） ===== -->
      <div class="site-footer">
        <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">鄂ICP备2026035916号</a>
        <span class="site-footer-sep">|</span>
        <span>运营主体：唐帅</span>
        <span class="site-footer-sep">|</span>
        <span>联系电话：19807189010</span>
        <span class="site-footer-sep">|</span>
        <a href="mailto:2966255045@qq.com">2966255045@qq.com</a>
        <span class="site-footer-sep">|</span>
        <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42282602000160" target="_blank" rel="noopener noreferrer">鄂公网安备42282602000160号</a>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
